name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

# Cancel in-flight runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shantelyur_test
  # DIRECT_URL is required by prisma/schema.prisma (directUrl = env("DIRECT_URL")).
  # In CI there is no connection pooler, so it is identical to DATABASE_URL.
  # For production/Supabase: set DIRECT_URL to the "Direct connection" URL in
  # your .env file (different from DATABASE_URL when using PgBouncer/Supavisor).
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shantelyur_test
  JWT_ACCESS_SECRET: ci-access-secret-minimum-32-characters
  JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  # ─── Stage 1: Lint + Type-check ───────────────────────────────────────────
  lint:
    name: "Stage 1 · Lint & Type-check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

  # ─── Stage 2: Unit Tests (fail fast, coverage gate) ───────────────────────
  unit:
    name: "Stage 2 · Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests with coverage
        run: npx jest --testPathPattern="tests/unit" --coverage --coverageReporters=text --coverageReporters=lcov
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/lcov.info

  # ─── Stage 3: Integration Tests (needs Postgres) ──────────────────────────
  integration:
    name: "Stage 3 · Integration Tests"
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shantelyur_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Integration tests (mocked Prisma — no DB needed)
        run: npx jest --testPathPattern="tests/integration" --forceExit
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}

      - name: Property-based tests
        run: npx jest --testPathPattern="tests/properties" --forceExit
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}

  # ─── Stage 4: E2E Tests (Playwright, headless) ────────────────────────────
  e2e:
    name: "Stage 4 · E2E Tests"
    runs-on: ubuntu-latest
    needs: [unit, integration]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shantelyur_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema + seed database
        run: |
          npx prisma db push --skip-generate
          npx prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}

      - name: Start server + run E2E tests
        run: |
          nohup npm run start > /tmp/nextjs-server.log 2>&1 &
          npx wait-on http-get://localhost:3000/api/health --timeout 60000 \
            || (echo "=== Next.js server log ===" && cat /tmp/nextjs-server.log && exit 1)
          npx playwright test --timeout=30000
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─── Stage 5: Build Verification ─────────────────────────────────────────
  build:
    name: "Stage 5 · Build Verification"
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Next.js production build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          SKIP_ENV_VALIDATION: "1"
