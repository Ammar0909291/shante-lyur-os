<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;700;800;900&display=swap">
<style>html,body{margin:0;background:transparent;overflow:hidden}#st{position:relative;width:1920px;height:1080px;font-family:"Noto Sans Devanagari",sans-serif;color:#fff}
.word{position:absolute;left:0;right:0;top:420px;text-align:center;font-weight:800;font-size:120px;letter-spacing:.01em;text-shadow:0 0 40px rgba(0,0,0,.85),0 6px 24px rgba(0,0,0,.9)}
.word span{color:#f2b45a}
.sub{position:absolute;left:0;right:0;bottom:70px;text-align:center}.sub b{display:inline-block;max-width:1400px;font-weight:700;font-size:40px;line-height:1.35;text-shadow:0 0 6px #000,0 2px 4px #000,0 0 24px rgba(0,0,0,.9)}
.end{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
.end img{width:170px;height:170px;border-radius:50%}
.end h1{margin:22px 0 4px;font-weight:800;font-size:110px;line-height:1.1;letter-spacing:.02em}
.end p{margin:0 0 34px;color:#d6dbe4;font-weight:500;font-size:30px}
.btn{position:relative;height:80px;padding:0 44px;border-radius:40px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:34px;color:#fff;background:#ff0033}
.btn.done{background:#3a3d44;color:#e8e8e8}.bell{width:40px;height:40px;transform-origin:50% 10%}
.cur{position:absolute;width:44px;height:44px}.ring{position:absolute;border:3px solid rgba(255,255,255,.75);border-radius:50%}
</style></head><body><div id="st"></div><script>
const BELL = `<svg class="bell" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3.5a2 2 0 0 0-4 0v.8A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg>`;
const CUR = `<svg class="cur" viewBox="0 0 24 24"><path d="M5 2l14 12-6.2.9 3.6 6.6-2.6 1.4-3.6-6.7L5 20z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg>`;
const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const st = document.getElementById('st'); let CFG = null; fetch('cfg.json').then(r => r.json()).then(c => CFG = c);
window.draw = t => {
  const S = CFG.seg, n = CFG.shots.length, endT = n * S; let h = '';
  if (t < endT) {
    const i = Math.floor(t / S), s = CFG.shots[i], lt = t - i * S;
    const wk = sm(0.5, 1.1, lt) * (1 - sm(S - 0.7, S - 0.15, lt)), sc = 1.06 - 0.06 * sm(0.5, 2.0, lt);
    const w = s.word.replace(/\?$/, '<span>?</span>');
    h += `<div class="word" style="opacity:${wk.toFixed(3)};transform:scale(${sc.toFixed(4)})">${w}</div>`;
    const sk = sm(0.55, 0.75, lt) * (1 - sm(0.6 + s.d + 0.25, 0.6 + s.d + 0.45, lt));
    h += `<div class="sub" style="opacity:${sk.toFixed(3)}"><b>${s.line}</b></div>`;
    st.innerHTML = h; return;
  }
  const lt = t - endT, done = lt > 2.6;
  st.innerHTML = `<div class="end" style="opacity:${sm(0, 0.5, lt)}"><img src="avatar.png"><h1>द वांडरर</h1><p>वास्तविकता को खोजो · धारणाओं पर सवाल करो · सबूतों का पीछा करो</p>
    <div class="btn ${done ? 'done' : ''}" id="b">${done ? BELL + 'सब्सक्राइब्ड' : 'सब्सक्राइब करें'}</div></div>
    <div class="sub" style="opacity:${(sm(0.75, 0.95, lt) * (1 - sm(0.8 + CFG.end.d + 0.2, 0.8 + CFG.end.d + 0.4, lt))).toFixed(3)}"><b>${CFG.end.line}</b></div>`;
  const b = document.getElementById('b'), press = Math.exp(-Math.pow((lt - 2.55) / 0.06, 2)); b.style.transform = `scale(${1 - 0.07 * press})`;
  const bell = b.querySelector('.bell'); if (bell) bell.style.transform = `rotate(${Math.sin(lt * 28) * 22 * sm(2.6, 2.8, lt) * (1 - sm(3.4, 3.8, lt))}deg)`;
  const r = b.getBoundingClientRect(), tx = r.left + r.width * 0.55, ty = r.top + r.height * 0.55, k = sm(1.3, 2.45, lt), lv = sm(3.4, 4.3, lt);
  const x = tx + 260 + (tx - tx - 260) * k + lv * 300, y = ty + 180 + (-180) * k + lv * 140;
  st.insertAdjacentHTML('beforeend', CUR); const cu = st.lastElementChild; cu.style.left = x + 'px'; cu.style.top = y + 'px'; cu.style.opacity = Math.min(sm(1.1, 1.4, lt), 1 - lv);
  const rt = lt - 2.55; if (rt > 0 && rt < 0.6) { const R = 12 + rt * 100; st.insertAdjacentHTML('beforeend', `<div class="ring" style="left:${tx - R}px;top:${ty - R}px;width:${2 * R}px;height:${2 * R}px;opacity:${1 - rt / 0.6}"></div>`); }
};
</script></body></html>
