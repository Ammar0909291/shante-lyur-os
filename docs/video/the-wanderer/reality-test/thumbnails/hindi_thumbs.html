<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;800;900&display=swap">
<style>
html,body{margin:0;background:#000}.t{position:relative;width:1280px;height:720px;overflow:hidden;font-family:"Noto Sans Devanagari",sans-serif}
.t img{position:absolute;inset:0;width:1280px;height:720px}
.sh{position:absolute;inset:0}
.big{position:absolute;margin:0;font-weight:900;line-height:1.08;color:#fff;-webkit-text-stroke:12px #000;paint-order:stroke fill;text-shadow:0 10px 30px rgba(0,0,0,.8)}
.y{color:#ffd400}.c{color:#5ff0ff}.r{color:#ff3b3b}
.badge{position:absolute;padding:6px 22px 10px;background:#e8102a;color:#fff;font-weight:900;font-size:40px;border-radius:10px;transform:rotate(-3deg);box-shadow:0 8px 24px rgba(0,0,0,.6);border:4px solid #fff}
.small{position:absolute;color:#fff;font-weight:800;font-size:38px;-webkit-text-stroke:8px #000;paint-order:stroke fill}
.n{position:absolute;width:96px;height:96px;border-radius:50%;background:#ffd400;color:#000;font:900 60px/96px "Noto Sans Devanagari";text-align:center;border:6px solid #000;box-shadow:0 6px 20px rgba(0,0,0,.6)}
</style></head><body>
<div class="t" id="A"><img src="A.png"><div class="sh" style="background:linear-gradient(90deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,.35) 50%,rgba(0,0,0,0) 70%)"></div>
 <div class="badge" style="left:48px;top:44px">सिमुलेशन थ्योरी</div>
 <h1 class="big" style="left:48px;top:150px;font-size:132px">यह दुनिया<br><span class="y">नकली</span> है?</h1>
 <div class="small" style="left:52px;top:548px;font-size:48px">वो थ्योरी जो आपको <span class="r">हिला</span> देगी!</div></div>
<div class="t" id="B"><img src="B.png"><div class="sh" style="background:linear-gradient(90deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.2) 38%,rgba(0,0,0,0) 55%)"></div>
 <h1 class="big" style="left:44px;top:110px;font-size:150px">पृथ्वी<br>= <span class="c">कोड?</span></h1>
 <div class="badge" style="left:50px;top:520px;background:#000;border-color:#5ff0ff;color:#5ff0ff">क्या हम असली हैं?</div></div>
<div class="t" id="C"><img src="C.png"><div class="sh" style="background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,.1) 40%,rgba(0,0,0,0) 70%,rgba(0,0,0,.6) 100%)"></div>
 <h1 class="big" style="left:0;right:0;top:20px;text-align:center;font-size:110px">3 रास्ते, <span class="y">1 सच</span></h1>
 <div class="n" style="left:318px;top:250px">1</div><div class="n" style="left:578px;top:250px">2</div><div class="n" style="left:838px;top:250px">3</div>
 <div class="small" style="left:0;right:0;text-align:center;top:610px;font-size:44px">आप कौन से दरवाज़े में हैं<span class="y">?</span></div></div>
<script>document.querySelectorAll('.n').forEach(()=>{});</script>
</body></html>
